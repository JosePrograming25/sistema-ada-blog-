<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Blue-500 -->
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" /> <!-- Indigo-500 -->
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" /> <!-- Purple-500 -->
    </linearGradient>
  </defs>
  
  <!-- Outer Ring/Circuit -->
  <circle cx="50" cy="50" r="45" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.2" />
  
  <!-- Abstract A Shape -->
  <path d="M50 20 L80 80 H20 L50 20Z" fill="url(#grad1)" fill-opacity="0.1" stroke="url(#grad1)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Circuit Nodes -->
  <circle cx="20" cy="80" r="5" fill="#3b82f6" />
  <circle cx="80" cy="80" r="5" fill="#a855f7" />
  <circle cx="50" cy="20" r="5" fill="#06b6d4" />
  
  <!-- Tech Crossbar -->
  <path d="M35 55 H65" stroke="white" stroke-width="3" stroke-linecap="round" />
  <circle cx="35" cy="55" r="2" fill="white" />
  <circle cx="65" cy="55" r="2" fill="white" />

  <!-- Data Lines -->
  <path d="M50 20 V10" stroke="url(#grad1)" stroke-width="2" />
  <path d="M20 80 L10 85" stroke="url(#grad1)" stroke-width="2" />
  <path d="M80 80 L90 85" stroke="url(#grad1)" stroke-width="2" />
</svg>
